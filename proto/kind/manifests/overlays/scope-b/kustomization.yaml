apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kindproto-scope-b
resources:
  - namespace.yaml
  - ingress.yaml
  - ../../base
  # Rendered from the envelope by render.sh; machine-local, never committed.
  - .generated/secrets.yaml
patches:
  - path: .generated/runtime-patch.yaml
configMapGenerator:
  - name: pg-initdb
    files:
      - initdb/10-probe.sql
  - name: web-www
    files:
      - www/index.html
